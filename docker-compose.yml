version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - config/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Optional: run workers as separate processes
  soar-worker:
    build: .
    command: node src/workers/soarWorker.js
    env_file:
      - config/.env
    depends_on:
      - mongo
      - redis

  email-worker:
    build: .
    command: node src/workers/emailWorker.js
    env_file:
      - config/.env
    depends_on:
      - mongo
      - redis

  report-worker:
    build: .
    command: node src/workers/reportWorker.js
    env_file:
      - config/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongo_data:
